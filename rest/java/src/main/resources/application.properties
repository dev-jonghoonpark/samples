spring.application.name=ucp-java-server
server.port=${PORT:3000}

# Same environment variables as the Node.js and Python reference servers.
ucp.require-signatures=${REQUIRE_SIGNATURES:false}
ucp.allow-insecure-profile-urls=${ALLOW_INSECURE_PROFILE_URLS:false}
ucp.webhook-signing-key=${WEBHOOK_SIGNING_KEY:}
ucp.simulation-secret=${SIMULATION_SECRET:super-secret-sim-key}
ucp.products-db-path=${PRODUCTS_DB_PATH:databases/products.db}
ucp.transactions-db-path=${TRANSACTIONS_DB_PATH:databases/transactions.db}

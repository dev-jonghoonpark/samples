name: Java Build and Test

on:
  push:
    branches: [main]
    paths:
      - "rest/java/**"
      - ".github/workflows/java.yml"
  pull_request:
    branches: [main]
    paths:
      - "rest/java/**"
      - ".github/workflows/java.yml"

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (Java ${{ matrix.java-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        java-version: [17, 21, 25]
    defaults:
      run:
        working-directory: rest/java

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
          cache: gradle
          cache-dependency-path: |
            rest/java/*.gradle.kts
            rest/java/gradle/wrapper/gradle-wrapper.properties

      - name: Build and test
        run: ./gradlew build

      - name: Start server
        run: |
          java -jar build/libs/ucp-java-server.jar &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/.well-known/ucp > /dev/null; then
              echo "Server is ready"
              exit 0
            fi
            sleep 1
          done
          echo "Server failed to start within 30 seconds"
          exit 1
